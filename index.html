<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>NexoTribu</title>
    <meta name="description" content="Mensajería moderna con comunidades y bots" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#202c33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexoTribu" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--c-bg, #05080A); }
    #root { height: 100%; overflow: hidden; }
    body.allow-scroll, body.allow-scroll #root { overflow: auto; height: auto; min-height: 100%; }
  </style>
  <body>
    <div id="root"></div>
    <div id="pre-react-error" style="display:none;position:fixed;inset:0;background:#b91c1c;color:#fff;padding:24px;font-family:monospace;z-index:9999;overflow:auto">
      <h2 style="margin:0 0 12px;font-size:18px">⚠️ Error al iniciar</h2>
      <pre style="font-size:12px;white-space:pre-wrap;margin:0"></pre>
      <button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;background:#fff;color:#b91c1c;border:none;border-radius:8px;font-weight:700;cursor:pointer">Recargar</button>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            // When a new SW takes over, reload so users always get fresh code
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing
              if (!newWorker) return
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                  window.location.reload()
                }
              })
            })
          })
          // If the controlling SW changes (another tab triggered the update), reload
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload()
          })
        })
      }
    </script>
  </body>
</html>
