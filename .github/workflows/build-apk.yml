name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Sign and build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > android/app/release.keystore 2>/dev/null; then
              cd android && ./gradlew assembleRelease \
                -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
                --no-daemon || echo "Release build failed, will use debug APK"
            else
              echo "Invalid keystore base64, skipping release build"
            fi
          else
            echo "No keystore found, skipping release build"
          fi

      - name: Copy APK to public folder
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/src/main/assets/public/mimensajero.apk
            cp android/app/build/outputs/apk/release/app-release.apk public/mimensajero.apk
            echo "Using release APK"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/src/main/assets/public/mimensajero.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk public/mimensajero.apk
            echo "Using debug APK"
          fi

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(date +%Y.%m.%d)"
          APK_PATH=""
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          # Delete existing release with same tag if exists
          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$VERSION" 2>/dev/null || true
          gh release create "$VERSION" "$APK_PATH#mimensajero.apk" \
            --title "Mi Mensajero $VERSION" \
            --notes "Build automático $(date +%Y-%m-%d)" \
            --latest

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimensajero-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Commit updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android/app/src/main/assets/public/mimensajero.apk
          git add -f public/mimensajero.apk
          git diff --staged --quiet || git commit -m "chore: update APK build [skip ci]"
          git push
