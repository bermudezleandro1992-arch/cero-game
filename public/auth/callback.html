<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NexoTribu - Autenticando...</title>
  <style>
    body { background: #05080A; color: #fff; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  </style>
</head>
<body>
  <p>Iniciando sesión...</p>
  <script>
    const hash = window.location.hash.substring(1)
    if (hash) {
      window.location.href = 'app.mimensajero.app://login-callback#' + hash
    } else {
      window.location.href = 'https://nexotribu.vercel.app'
    }
  </script>
</body>
</html>
